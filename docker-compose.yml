services:
  warungduniawi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warungduniawi-web
    restart: unless-stopped
    ports:
      - "3001:3000" # Expose ke port 3001 host agar tidak tabrakan dengan port 3000 Talysa
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
    devices:
      - "/dev/snd:/dev/snd" # Mapping driver suara host agar Docker bisa langsung atur ALSA speaker
    volumes:
      - warungduniawi-data:/app/data
      - warungduniawi-uploads:/app/public/uploads

volumes:
  warungduniawi-data:
    name: warungduniawi_sqlite_data
  warungduniawi-uploads:
    name: warungduniawi_uploads_data
